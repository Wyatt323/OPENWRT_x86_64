name: Update Checker

# The main build workflow keeps the weekly schedule. This checker is manual.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: update-checker-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get upstream commit
        id: getHash
        run: |
          commit=$(git ls-remote --exit-code "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')
          test -n "$commit"
          echo "commitHash=$commit" >> "$GITHUB_OUTPUT"

      - name: Compare upstream commit
        id: cacheHash
        uses: actions/cache@v4
        with:
          path: .commitHash
          key: lede-master-${{ steps.getHash.outputs.commitHash }}

      - name: Trigger build for new upstream commit
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'x86_64-full.yml',
              ref: context.ref.replace('refs/heads/', '')
            });

      # Only remember a revision after dispatch succeeds, so a failed trigger can retry.
      - name: Save successfully dispatched upstream commit
        if: steps.cacheHash.outputs.cache-hit != 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.getHash.outputs.commitHash }}
        run: printf '%s\n' "$UPSTREAM_COMMIT" > .commitHash
