name: Build OpenWrt_x86_64

permissions:
  contents: write
  actions: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      config_only:
        description: '只验证源码和最终配置，不下载或编译固件'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: 00 16 * * 0

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: x86_64-full.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: 检查服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT


    - name: 释放磁盘空间
      if: inputs.config_only != true
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        preinstalled-runtimes: true
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
        CONFIG_ONLY: ${{ inputs.config_only }}
      run: |
        if [ "$CONFIG_ONLY" != 'true' ]; then
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
        fi
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        if [ "$CONFIG_ONLY" != 'true' ]; then
          sudo -E apt-get -qq autoremove --purge
        fi
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir


    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Cache
      if: inputs.config_only != true
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    - name: Restore downloaded sources
      id: downloads-cache
      if: inputs.config_only != true
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: /workdir/openwrt/dl
        key: ${{ runner.os }}-lede-dl-${{ hashFiles('x86_64-full.config', 'diy-part*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-lede-dl-${{ hashFiles('x86_64-full.config', 'diy-part*.sh') }}-
          ${{ runner.os }}-lede-dl-

    - name: Load custom feeds
      run: |
        if [ -f "$FEEDS_CONF" ]; then
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
        fi
        cd openwrt
        bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        if [ -d files ]; then
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
        fi
        cp "$CONFIG_FILE" openwrt/.config
        cd openwrt
        bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: inputs.config_only != true && (github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh'))
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Validate final configuration
      run: |
        mkdir -p "$GITHUB_WORKSPACE/build-logs"
        cp openwrt/.config "$GITHUB_WORKSPACE/build-logs/requested.config"
        cd openwrt
        make defconfig RECURSIVE_DEP_IS_ERROR=1 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/config.log"
        if grep -Ei '(^|:)error:|recursive dependency detected' "$GITHUB_WORKSPACE/build-logs/config.log"; then
          echo '::error::Kconfig 报告错误，停止构建。'
          exit 1
        fi
        cp .config "$GITHUB_WORKSPACE/build-logs/final.config"
        cp feeds.conf.default "$GITHUB_WORKSPACE/build-logs/feeds.conf.default"
        bash "$GITHUB_WORKSPACE/scripts/check-config.sh" "$GITHUB_WORKSPACE/build-logs/requested.config" .config
        {
          echo "LEDE=$(git rev-parse HEAD)"
          echo "MMWX=$(git -C package/luci-theme-mmwx rev-parse HEAD)"
          echo "OpenClash=$(git -C package/lean/OpenClash rev-parse HEAD)"
          echo "NetSpeedTest=$(git -C package/lean/NetSpeedTest rev-parse HEAD)"
        } > "$GITHUB_WORKSPACE/build-logs/source-revisions.txt"

    - name: Download package
      id: package
      if: inputs.config_only != true
      timeout-minutes: 75
      env:
        BUILD_LOG_DIR: ${{ github.workspace }}/build-logs
      run: |
        cd openwrt
        bash "$GITHUB_WORKSPACE/scripts/download-packages.sh"

    - name: Save downloaded sources
      if: always() && !cancelled() && steps.downloads-cache.outputs.cache-primary-key != '' && steps.downloads-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.downloads-cache.outputs.cache-primary-key }}

    - name: Compile the firmware
      id: compile
      if: inputs.config_only != true
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        if ! make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/build.log"; then
          make -j2 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build-logs/build.log"
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Upload build diagnostics
      if: always() && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: build-logs/
        if-no-files-found: ignore
        retention-days: 14

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: success() && steps.compile.outputs.status == 'success' && (env.UPLOAD_FIRMWARE == 'true' || env.UPLOAD_RELEASE == 'true')
      run: |
        cd openwrt/bin/targets/*/*
        if ! find . -maxdepth 1 -type f \( -name '*.img' -o -name '*.img.gz' -o -name '*.vmdk' -o -name '*.qcow2' -o -name '*.vhdx' \) -print -quit | grep -q .; then
          echo '::error::未找到 x86 固件镜像，停止发布。'
          exit 1
        fi
        mkdir -p "$GITHUB_WORKSPACE/firmware"
        find . -maxdepth 1 -type f -exec cp -t "$GITHUB_WORKSPACE/firmware" {} +
        cp "$GITHUB_WORKSPACE/build-logs/source-revisions.txt" "$GITHUB_WORKSPACE/firmware/"
        echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true'
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(grep https cowtransfer.log | cut -f3 -d' ')" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true'
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(grep https wetransfer.log | cut -f3 -d' ')" >> "$GITHUB_OUTPUT"

    - name: Generate release tag
      id: tag
      if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        {
          echo 'MMWX 为默认主题，内置官方 OpenClash。'
          echo
          echo 'Source revisions:'
          cat build-logs/source-revisions.txt
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@v2
      if: success() && steps.tag.outputs.status == 'success' && steps.organize.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: true

    # - name: Delete workflow runs
    #   uses: GitRML/delete-workflow-runs@main
    #   with:
    #     retain_days: 1
    #     keep_minimum_runs: 1

    - name: Delete workflow runs
      if: always() && inputs.config_only != true
      continue-on-error: true
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 1

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: success() && steps.release.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
      continue-on-error: true
      with:
        keep_latest: 30
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
